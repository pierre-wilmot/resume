# Jobs

# The Klone Factory
- company: The Klone Factory
  logo: klonefactory.png
  position: Founder
  duration: 2026 &mdash; Present
  url: "https://theklonefactory.com/"
  summary: "Founded and run <a href=\"https://theklonefactory.com/\">The Klone Factory</a> end-to-end &mdash; technology, product, and business &mdash; as a 3D digitisation service for auction houses and antique dealers. Buyers who attend a viewing day can inspect a piece by hand and bid with confidence; remote bidders, working only from flat catalogue photos, often can't judge condition well enough to bid the same amount, if at all. I provide a solution that helps close that gap, owning every layer of it: <strong>Hardware</strong> &mdash; designed and built the capture rig from scratch (electronics, control systems, PCB design), engineered for repeatable, high-quality capture in a working auction house environment rather than a lab. <strong>Software</strong> &mdash; built the full pipeline: photogrammetry and Gaussian splatting reconstruction, a fast web-native 3D viewer, and provenance/condition notes anchored directly to the model, so remote buyers get the same close inspection as an in-person visit. <strong>Distribution &amp; commercial</strong> &mdash; took the product to market myself: prospecting and closing auction house clients, managing ongoing client relationships, running marketing and content, and setting overall business strategy and pricing. Operating as a one-person company across hardware, software, and go-to-market forces tight prioritisation and fast iteration."

# Playstation
- company: PlayStation (Sony Interactive Entertainment)
  logo: playstation.png
  position: Machine Learning Engineer
  duration: 2025-2026
  summary: "At PlayStation, I work on a deep learning pipeline for high-fidelity facial animation. The system learns to animate production-ready Maya face rigs directly from head-mounted camera footage. My contributions focus on building and optimizing neural architectures that map video inputs to rig control parameters, using a small set of artist-annotated training sequences. My work bridges deep learning research and practical production tools, accelerating the animation process for cinematic game content."

# Dimension
- company: Dimension
  logo: dimension.png
  position: Senior Engineer
  duration: 2022-2025
  summary: "Dimension's CTO owned the audiovisual and virtual-production hardware side &mdash; cameras, capture volumes, LED walls &mdash; while I owned software and ML strategy. My mandate was open-ended: work directly with producers, VFX artists, and on-set crew to identify where AI/ML could move the needle on production quality and cost, then build it. The main outcome was moving asset capture from traditional mesh-and-texture pipelines &mdash; which look flat and synthetic once composited into a shot &mdash; to NeRF and Gaussian splatting, capturing view-dependent effects (reflections, subsurface scattering, specular highlights) that read as lifelike on screen. This shifted what the studio could deliver: instead of splats/NeRFs being limited to background or environment capture, we could produce hero assets &mdash; the characters and objects a shot is actually about. Alongside this I built material acquisition via differential rendering for relighting, scene understanding (segmentation, depth estimation) for virtual production, and generative pipelines (Stable Diffusion, LoRA, ControlNet) for image/video creation."

