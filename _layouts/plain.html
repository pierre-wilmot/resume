<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F7F6F2;
      --ink:       #1A1A1A;
      --ink-mid:   #4A4A4A;
      --ink-light: #888888;
      --blue:      #1C3F6E;
      --blue-pale: #E8EDF4;
      --rule:      #D8D6CF;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    html { font-size: 17px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .col {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    nav a {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid var(--blue);
      padding-bottom: 1px;
    }
    nav a:hover { opacity: 0.7; }

    article :first-child { margin-top: 0; }

    article h1 {
      font-family: var(--mono);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.3;
      margin: 2.5rem 0 1.25rem;
    }

    article h2 {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--blue);
      margin: 2.5rem 0 1rem;
    }

    article h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.75rem 0 0.75rem;
    }

    article p, article li { color: var(--ink-mid); }

    article p { margin: 0 0 1.1rem; }

    article ul, article ol {
      margin: 0 0 1.1rem;
      padding-left: 1.4rem;
    }

    article li { margin-bottom: 0.4rem; }

    article strong { color: var(--ink); }

    article a { color: var(--blue); }

    article hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 2.5rem 0;
    }

    article blockquote {
      border-left: 2px solid var(--rule);
      padding-left: 1rem;
      color: var(--ink-light);
      margin: 0 0 1.1rem;
    }

    article code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: var(--blue-pale);
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }

    article table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 1.5rem;
      font-size: 0.95rem;
    }
    article th, article td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--rule);
    }
    article th { font-family: var(--mono); color: var(--ink); }
  </style>
</head>
<body>
  <nav>
    <a href="./">&larr; Pierre Wilmot &mdash; CV</a>
    <a href="ai-profile.md">Raw markdown source</a>
  </nav>
  <div class="col">
    <article>
      {{ content }}
    </article>
  </div>
</body>
</html>
